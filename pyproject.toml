[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbz-upscale"
version = "0.1.0"
description = "CLI tool for upscaling CBZ comic book archives using AI upscalers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Osore00" }]
keywords = ["cbz", "upscale", "comic", "manga", "real-esrgan", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6",
]

[project.scripts]
cbz-upscale = "cbz_upscale.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "Pillow>=10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
